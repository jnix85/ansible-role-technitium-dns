---
# Ordering matters: the primary must exist before any secondary can join it.
# With the default "linear" strategy Ansible finishes each task on every host
# before starting the next, so the primary-only task below completes before the
# secondaries run theirs. Do not run this role with strategy: free.

- name: Initialize the cluster on the primary node
  technitium_dns_cluster:
    api_url: "{{ technitium_dns_api_args.api_url }}"
    api_token: "{{ technitium_dns_api_args.api_token }}"
    validate_certs: "{{ technitium_dns_api_args.validate_certs }}"
    api_timeout: "{{ technitium_dns_api_args.api_timeout }}"
    state: "{{ technitium_dns_cluster_state }}"
    role: primary
    cluster_domain: "{{ technitium_dns_cluster_domain }}"
    node_ip_addresses: "{{ technitium_dns_cluster_node_ip_addresses }}"
    options: "{{ technitium_dns_cluster_options }}"
    force: "{{ technitium_dns_cluster_force | default(false) }}"
  when: technitium_dns_cluster_role == 'primary'
  register: technitium_dns_cluster_primary_result

# Joining transfers the whole primary configuration, which takes a while and is
# not something to run concurrently on several nodes.
- name: Join the cluster as a secondary node
  technitium_dns_cluster:
    api_url: "{{ technitium_dns_api_args.api_url }}"
    api_token: "{{ technitium_dns_api_args.api_token }}"
    validate_certs: "{{ technitium_dns_api_args.validate_certs }}"
    api_timeout: "{{ technitium_dns_cluster_join_timeout }}"
    state: "{{ technitium_dns_cluster_state }}"
    role: secondary
    cluster_domain: "{{ technitium_dns_cluster_domain }}"
    node_ip_addresses: "{{ technitium_dns_cluster_node_ip_addresses }}"
    primary_url: "{{ technitium_dns_cluster_primary_url }}"
    primary_ip_address: "{{ technitium_dns_cluster_primary_ip_address }}"
    primary_username: "{{ technitium_dns_admin_username }}"
    primary_password: "{{ technitium_dns_admin_password }}"
    ignore_certificate_errors: "{{ technitium_dns_cluster_ignore_certificate_errors }}"
    force: "{{ technitium_dns_cluster_force | default(false) }}"
  when: technitium_dns_cluster_role == 'secondary'
  throttle: 1
  register: technitium_dns_cluster_secondary_result

# Joining overwrites the replicated sections. Node-local settings are not
# replicated, but re-asserting them here costs one API call and removes any
# doubt about what the node ended up with.
- name: Re-apply node-local settings after joining
  technitium_dns_settings:
    api_url: "{{ technitium_dns_api_args.api_url }}"
    api_token: "{{ technitium_dns_api_args.api_token }}"
    validate_certs: "{{ technitium_dns_api_args.validate_certs }}"
    api_timeout: "{{ technitium_dns_api_args.api_timeout }}"
    settings: "{{ technitium_dns_node_settings }}"
  when:
    - technitium_dns_cluster_role == 'secondary'
    - technitium_dns_cluster_secondary_result is changed

- name: Read the resulting cluster state
  technitium_dns_info:
    api_url: "{{ technitium_dns_api_args.api_url }}"
    api_token: "{{ technitium_dns_api_args.api_token }}"
    validate_certs: "{{ technitium_dns_api_args.validate_certs }}"
    api_timeout: "{{ technitium_dns_api_args.api_timeout }}"
    gather: [cluster]
  register: technitium_dns_cluster_info
  when: technitium_dns_cluster_state == 'present'

- name: Report unreachable cluster nodes
  ansible.builtin.debug:
    msg: >-
      Cluster {{ technitium_dns_cluster_domain }} has nodes that are not connected:
      {{ unreachable_nodes | map(attribute='name') | join(', ') }}.
      They may still be converging; re-run the role or check connectivity on the
      cluster HTTPS port ({{ technitium_dns_https_port }}).
  vars:
    unreachable_nodes: >-
      {{ (technitium_dns_cluster_info.cluster.nodes | default([]))
         | rejectattr('state', 'in', ['Self', 'Connected']) | list }}
  when:
    - technitium_dns_cluster_state == 'present'
    - unreachable_nodes | length > 0
