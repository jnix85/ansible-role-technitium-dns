---
- name: Load OS specific variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
        - default.yml
      paths:
        - "{{ role_path }}/vars"
  tags: [always]

- name: Validate the requested configuration
  ansible.builtin.import_tasks: assert.yml
  tags: [always]

- name: Install Technitium DNS Server
  ansible.builtin.import_tasks: install.yml
  tags: [technitium_install]

- name: Manage the Technitium DNS Server service
  ansible.builtin.import_tasks: service.yml
  tags: [technitium_install, technitium_service]

- name: Obtain an API token
  ansible.builtin.import_tasks: bootstrap.yml
  tags: [always]

- name: Apply DNS server settings
  ansible.builtin.import_tasks: settings.yml
  tags: [technitium_settings]

- name: Configure clustering
  ansible.builtin.import_tasks: cluster.yml
  when: technitium_dns_cluster_enabled | bool
  tags: [technitium_cluster]

- name: Manage zones and records
  ansible.builtin.import_tasks: zones.yml
  tags: [technitium_zones]

- name: Manage access control
  ansible.builtin.import_tasks: access.yml
  tags: [technitium_access]

- name: Manage blocking
  ansible.builtin.import_tasks: blocking.yml
  tags: [technitium_blocking]

- name: Manage DNS apps
  ansible.builtin.import_tasks: apps.yml
  tags: [technitium_apps]

- name: Manage DHCP scopes
  ansible.builtin.import_tasks: dhcp.yml
  tags: [technitium_dhcp]

# Dynamic includes rather than imports so the role does not need
# community.crypto, ansible.posix or community.general installed unless the
# matching feature is used. acme.yml runs after zones.yml because DNS-01
# validation publishes its challenge record into a zone this play manages.
- name: Request and install an ACME certificate
  ansible.builtin.include_tasks: acme.yml
  when: technitium_dns_acme_enabled | bool
  tags: [technitium_acme]

- name: Configure the firewall
  ansible.builtin.include_tasks: firewall.yml
  when: technitium_dns_manage_firewall | bool
  tags: [technitium_firewall]

- name: Configure keepalived
  ansible.builtin.include_tasks: keepalived.yml
  when: technitium_dns_keepalived_enabled | bool
  tags: [keepalived]
