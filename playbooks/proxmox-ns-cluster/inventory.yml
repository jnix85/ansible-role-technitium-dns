---
# Five-node Technitium cluster on real Proxmox topology, VIP held by whichever
# node is healthiest via on-node VRRP.
#
#   cluster domain : dns.internal.example.com   (config replication)
#   service VIP    : 10.1.0.53/23                (VRRP, moves between nodes)
#   nodes          : ns1-ns5 (10.1.0.21-25/23), one per pve01-pve05
#
# Mirrors the shape of the production ns1-ns5 LXCs (see
# terraform/technitium and proxmox-ansible-roles' dns_servers group), but
# this playbook is not currently what deploys them - see this directory's
# README before pointing it at real hosts.
#
# virtual_router_id 53 matches the id proxmox-ansible-roles already reserves
# for the DNS VIP on this subnet (netbox=90, unifi=80 are taken by other
# services - see proxmox-ansible-roles/inventory/group_vars/*_servers).

all:
  children:
    technitium_dns:
      hosts:
        ns1:
          ansible_host: 10.1.0.21
          technitium_dns_node_domain: ns1.dns.internal.example.com
          # Highest priority, so this node holds the VIP when healthy.
          technitium_dns_vrrp_priority: 150
        ns2:
          ansible_host: 10.1.0.22
          technitium_dns_node_domain: ns2.dns.internal.example.com
          technitium_dns_vrrp_priority: 140
        ns3:
          ansible_host: 10.1.0.23
          technitium_dns_node_domain: ns3.dns.internal.example.com
          technitium_dns_vrrp_priority: 130
        ns4:
          ansible_host: 10.1.0.24
          technitium_dns_node_domain: ns4.dns.internal.example.com
          technitium_dns_vrrp_priority: 120
        ns5:
          ansible_host: 10.1.0.25
          technitium_dns_node_domain: ns5.dns.internal.example.com
          technitium_dns_vrrp_priority: 110

      vars:
        # ------------------------------------------------------------ access
        # Real deployments keep these in ansible-vault.
        technitium_dns_admin_password: "{{ vault_technitium_admin_password }}"

        # ---------------------------------------------------------- clustering
        technitium_dns_cluster_enabled: true
        technitium_dns_cluster_domain: dns.internal.example.com
        technitium_dns_cluster_primary: ns1

        # ------------------------------------------------------------ settings
        # Replicated to every node from the primary.
        technitium_dns_settings:
          recursion: AllowOnlyForPrivateNetworks
          dnssecValidation: true
          forwarders:
            - 9.9.9.9
            - 149.112.112.112
          forwarderProtocol: Tls
          enableBlocking: true
          blockListUrls:
            - https://big.oisd.nl/

        # -------------------------------------------------------------- zones
        # Catalog membership provisions these on every secondary automatically.
        technitium_dns_zones:
          - zone: dns.internal.example.com
            type: Primary
            catalog: "{{ technitium_dns_cluster_catalog_zone }}"
            records:
              - domain: ns1.dns.internal.example.com
                type: A
                data: {ipAddress: 10.1.0.21}
                update_ptr: true
                create_ptr_zone: true
              - domain: ns2.dns.internal.example.com
                type: A
                data: {ipAddress: 10.1.0.22}
                update_ptr: true
              - domain: ns3.dns.internal.example.com
                type: A
                data: {ipAddress: 10.1.0.23}
                update_ptr: true
              - domain: ns4.dns.internal.example.com
                type: A
                data: {ipAddress: 10.1.0.24}
                update_ptr: true
              - domain: ns5.dns.internal.example.com
                type: A
                data: {ipAddress: 10.1.0.25}
                update_ptr: true
              # The service address clients actually use.
              - domain: dns.internal.example.com
                type: A
                exclusive: true
                data: {ipAddress: 10.1.0.53}

          - zone: 10.1.0.0/23
            type: Primary
            catalog: "{{ technitium_dns_cluster_catalog_zone }}"

        # --------------------------------------------------------- keepalived
        technitium_dns_keepalived_enabled: true
        technitium_dns_keepalived_instances:
          - name: DNS_VIP
            interface: "{{ ansible_default_ipv4.interface }}"
            virtual_router_id: 53
            priority: "{{ technitium_dns_vrrp_priority }}"
            virtual_ipaddresses:
              - address: 10.1.0.53
                prefix: 23
            authentication:
              auth_type: PASS
              auth_pass: "{{ vault_vrrp_password }}"

        # ----------------------------------------------------------- firewall
        technitium_dns_manage_firewall: true
