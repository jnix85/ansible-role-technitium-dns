---
# A three node Technitium cluster behind one floating service address.
#
#   cluster domain : example.com          (config replication)
#   service VIP    : 192.168.10.4         (VRRP, moves between nodes)
#   nodes          : 192.168.10.5/.6/.7
#
# Clients are pointed at the VIP. Whichever node holds it answers, and all three
# hold identical configuration because of clustering.

all:
  children:
    local:
      hosts:
        localhost:
          ansible_connection: local
          ansible_pyython_interpreter: auto_silent
    technitium_dns:
      hosts:
        dns01:
          ansible_host: 10.1.0.5
        dns02:
          ansible_host: 10.1.0.6
        dns03:
          ansible_host: 10.1.0.7
        dns04:
          ansible_host: 10.1.0.8
        dns05:
          ansible_host: 10.1.0.9

          