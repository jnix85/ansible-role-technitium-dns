---
# Three nodes, one Technitium cluster, one floating VIP.
#
# keepalived needs NET_ADMIN to manage addresses and NET_BROADCAST/NET_RAW for
# VRRP, hence the privileged containers on a dedicated user-defined network.
role_name_check: 1

dependency:
  name: galaxy
  options:
    requirements-file: molecule/requirements.yml

driver:
  name: docker

platforms:
  - name: technitium-ns1
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    command: /lib/systemd/systemd
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    capabilities: [NET_ADMIN, NET_BROADCAST, NET_RAW]
    networks:
      - name: technitium-cluster
    groups: [technitium_dns]

  - name: technitium-ns2
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    command: /lib/systemd/systemd
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    capabilities: [NET_ADMIN, NET_BROADCAST, NET_RAW]
    networks:
      - name: technitium-cluster
    groups: [technitium_dns]

  - name: technitium-ns3
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    command: /lib/systemd/systemd
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    capabilities: [NET_ADMIN, NET_BROADCAST, NET_RAW]
    networks:
      - name: technitium-cluster
    groups: [technitium_dns]

provisioner:
  name: ansible
  env:
    ANSIBLE_LIBRARY: "${MOLECULE_PROJECT_DIRECTORY}/library"
    ANSIBLE_MODULE_UTILS: "${MOLECULE_PROJECT_DIRECTORY}/module_utils"
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      stdout_callback: yaml
      # Secondaries must not race ahead of the primary's cluster init.
      strategy: linear
  playbooks:
    converge: converge.yml
    verify: verify.yml

scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - converge
    - idempotence
    - verify
    - destroy
