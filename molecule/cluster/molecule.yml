---
# Three nodes, one Technitium cluster, one floating VIP.
#
# keepalived needs NET_ADMIN to manage addresses and NET_BROADCAST/NET_RAW for
# VRRP, hence the privileged containers on a dedicated user-defined network.
role_name_check: 1

dependency:
  name: galaxy
  options:
    requirements-file: molecule/requirements.yml

driver:
  name: docker

platforms:
  - name: technitium-ns1
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    # Must be set explicitly: with no command the docker driver runs a sleep
    # loop, systemd never becomes PID 1, and the Technitium installer refuses
    # to run with "systemd/openrc was not detected".
    command: /lib/systemd/systemd
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    capabilities: [NET_ADMIN, NET_BROADCAST, NET_RAW]
    networks:
      - name: technitium-cluster
    groups: [technitium_dns]

  - name: technitium-ns2
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    # Must be set explicitly: with no command the docker driver runs a sleep
    # loop, systemd never becomes PID 1, and the Technitium installer refuses
    # to run with "systemd/openrc was not detected".
    command: /lib/systemd/systemd
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    capabilities: [NET_ADMIN, NET_BROADCAST, NET_RAW]
    networks:
      - name: technitium-cluster
    groups: [technitium_dns]

  - name: technitium-ns3
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    # Must be set explicitly: with no command the docker driver runs a sleep
    # loop, systemd never becomes PID 1, and the Technitium installer refuses
    # to run with "systemd/openrc was not detected".
    command: /lib/systemd/systemd
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    capabilities: [NET_ADMIN, NET_BROADCAST, NET_RAW]
    networks:
      - name: technitium-cluster
    groups: [technitium_dns]

provisioner:
  name: ansible
  env:
    ANSIBLE_LIBRARY: "${MOLECULE_PROJECT_DIRECTORY}/library"
    ANSIBLE_MODULE_UTILS: "${MOLECULE_PROJECT_DIRECTORY}/module_utils"
  # An idempotence failure otherwise only names the non-idempotent task, not
  # what changed. Every module here already returns a diff key; --diff is
  # what makes ansible print it.
  options:
    diff: true
  inventory:
    # Scoped to the containers by name, not to "all": molecule's own create
    # and destroy playbooks run against localhost, which must keep its own
    # user.
    host_vars:
      technitium-ns1: &container_root
        ansible_user: root
        # docker exec already runs as root in these privileged containers, so
        # become/sudo is both unnecessary and unreliable this early in boot:
        # sudo's PAM account-management phase needs dbus/systemd-logind, which
        # can still be settling for a few seconds after systemd itself reports
        # "running".
        ansible_become: false
      technitium-ns2: *container_root
      technitium-ns3: *container_root
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      # Not stdout_callback: yaml - that resolves to community.general.yaml,
      # which was removed in community.general 12.0.0. The built-in default
      # callback does the same job through this option.
      callback_result_format: yaml
      # Secondaries must not race ahead of the primary's cluster init.
      strategy: linear
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
