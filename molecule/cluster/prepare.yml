---
- name: Prepare the test containers
  hosts: all
  # Facts are gathered explicitly below: gathering runs before any task, and
  # until systemd is up the nss and PAM lookups it needs will fail.
  gather_facts: false
  become: false

  tasks:
    # systemd is still booting when molecule moves on from create. Until it is
    # up, PAM cannot resolve accounts - which is what produced the earlier
    # "sudo: PAM account management error" - and the Technitium installer
    # refuses to run at all with "systemd/openrc was not detected".
    # raw needs neither python nor become, so it works before either is usable.
    - name: Wait for systemd to finish booting
      ansible.builtin.raw: systemctl is-system-running --wait
      register: systemd_state
      changed_when: false
      # degraded is normal in a container; only a total failure to boot matters.
      failed_when: systemd_state.stdout is not search('running|degraded')

    - name: Gather facts now that the system is up
      ansible.builtin.setup:
      become: true

    # Read the role's own package names rather than repeating them here, so the
    # test cannot drift from what the role installs on each distribution.
    - name: Load the role's OS specific variables
      ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
      vars:
        params:
          files:
            - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
            - "{{ ansible_distribution }}.yml"
            - "{{ ansible_os_family }}.yml"
            - default.yml
          paths:
            - "{{ playbook_dir }}/../../vars"

    - name: Refresh the package cache, exactly as the role does
      become: true
      block:
        - ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/package_cache.yml"

    # verify.yml queries the server with dig to prove records resolve over the
    # wire. The role installs one here anyway for the keepalived health
    # check, but verify.yml must not depend on that ordering.
    - name: Install a DNS client for the verify playbook
      ansible.builtin.package:
        name: "{{ technitium_dns_dns_client_packages }}"
        state: present
      become: true
      register: dns_client
      until: dns_client is succeeded
      retries: 3
      delay: 5
      when: technitium_dns_dns_client_packages | length > 0
