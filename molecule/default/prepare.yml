---
- name: Prepare the test container
  hosts: all
  become: true
  gather_facts: true

  tasks:
    # verify.yml queries the server with dig to prove records resolve over the
    # wire. The role only installs a DNS client when the keepalived health check
    # needs one, and this scenario does not enable keepalived.
    - name: Install a DNS client for the verify playbook
      ansible.builtin.package:
        name: "{{ 'bind-utils' if ansible_os_family == 'RedHat' else 'dnsutils' }}"
        state: present
      register: dns_client
      until: dns_client is succeeded
      retries: 3
      delay: 5
