---
role_name_check: 1

dependency:
  name: galaxy
  options:
    requirements-file: molecule/requirements.yml

driver:
  name: docker

platforms:
  - name: technitium-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  # The verify playbook does not include the role, so the role-local modules
  # have to be put on the search path explicitly.
  env:
    ANSIBLE_LIBRARY: "${MOLECULE_PROJECT_DIRECTORY}/library"
    ANSIBLE_MODULE_UTILS: "${MOLECULE_PROJECT_DIRECTORY}/module_utils"
  inventory:
    # Scoped to the containers by name, not to "all": molecule's own create and
    # destroy playbooks run against localhost, which must keep its own user.
    host_vars:
      technitium-default:
        ansible_user: root
        # The containers already run as root. Attempting sudo there fails with
        # "PAM account management error", and it buys nothing.
        ansible_become: false
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      # Not stdout_callback: yaml - that resolves to community.general.yaml,
      # which was removed in community.general 12.0.0. The built-in default
      # callback does the same job through this option.
      callback_result_format: yaml
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
