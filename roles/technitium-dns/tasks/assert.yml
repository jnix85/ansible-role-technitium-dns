---
# Fail early and specifically. Every check here maps to a failure mode that is
# painful to diagnose once the server is running.

- name: Assert an administrator password is configured
  ansible.builtin.assert:
    that:
      - technitium_dns_admin_password | length > 0
      - technitium_dns_admin_password != technitium_dns_default_admin_password
    fail_msg: >-
      Set technitium_dns_admin_password to something other than
      '{{ technitium_dns_default_admin_password }}'. Keep it in a vault.
    quiet: true
  when: not technitium_dns_api_token | length

- name: Assert the install method is supported
  ansible.builtin.assert:
    that:
      - technitium_dns_install_method in ['script', 'tarball']
    fail_msg: >-
      technitium_dns_install_method must be 'script' or 'tarball', got
      '{{ technitium_dns_install_method }}'.
    quiet: true

- name: Assert a pinned version is available for the tarball install method
  ansible.builtin.assert:
    that:
      - technitium_dns_tarball_local_path | length > 0
        or technitium_dns_tarball_url | length > 0
    fail_msg: >-
      The tarball install method needs technitium_dns_tarball_url or
      technitium_dns_tarball_local_path.
    quiet: true
  when: technitium_dns_install_method == 'tarball'

# ---------------------------------------------------------------- clustering

- name: Validate the cluster configuration
  when: technitium_dns_cluster_enabled | bool
  block:
    - name: Assert a cluster domain and primary node are set
      ansible.builtin.assert:
        that:
          - technitium_dns_cluster_domain | length > 0
          - technitium_dns_cluster_primary | length > 0
        fail_msg: >-
          Clustering needs technitium_dns_cluster_domain and
          technitium_dns_cluster_primary (the inventory_hostname of the primary).
        quiet: true

    - name: Assert the cluster domain looks like an FQDN
      ansible.builtin.assert:
        that:
          - technitium_dns_cluster_domain is match('^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+$')
        fail_msg: >-
          technitium_dns_cluster_domain '{{ technitium_dns_cluster_domain }}' is not a
          fully qualified domain name. It cannot be changed after initialization.
        quiet: true

    - name: Assert this node's domain is a child of the cluster domain
      ansible.builtin.assert:
        that:
          - technitium_dns_node_domain != technitium_dns_cluster_domain
          - technitium_dns_node_domain.endswith('.' + technitium_dns_cluster_domain)
        fail_msg: >-
          technitium_dns_node_domain must be a child of the cluster domain. Got
          '{{ technitium_dns_node_domain }}' for cluster
          '{{ technitium_dns_cluster_domain }}'; expected something like
          'ns1.{{ technitium_dns_cluster_domain }}'.
        quiet: true

    - name: Assert the primary node is part of this play
      ansible.builtin.assert:
        that:
          - technitium_dns_cluster_primary in ansible_play_hosts_all
        fail_msg: >-
          The cluster primary '{{ technitium_dns_cluster_primary }}' is not in this
          play. Secondaries cannot join a primary that has not been initialized.
        quiet: true

    - name: Assert this node advertises at least one reachable address
      ansible.builtin.assert:
        that:
          - technitium_dns_cluster_node_ip_addresses | length > 0
          - technitium_dns_cluster_node_ip_addresses | reject('match', '^$') | list | length > 0
        fail_msg: >-
          technitium_dns_cluster_node_ip_addresses is empty. The other nodes need an
          address to reach this one on.
        quiet: true

# --------------------------------------------------------------------- ACME

- name: Validate the ACME configuration
  when: technitium_dns_acme_enabled | bool
  block:
    - name: Assert the ACME account and certificate details are configured
      ansible.builtin.assert:
        that:
          - technitium_dns_acme_account_email | length > 0
          - technitium_dns_acme_terms_agreed | bool
          - technitium_dns_acme_domains | length > 0
          - technitium_dns_acme_pfx_password | length > 0
        fail_msg: >-
          ACME needs technitium_dns_acme_account_email,
          technitium_dns_acme_terms_agreed: true, at least one entry in
          technitium_dns_acme_domains, and technitium_dns_acme_pfx_password
          (keep it in a vault).
        quiet: true

# ---------------------------------------------------------------- keepalived

- name: Validate the keepalived configuration
  when: technitium_dns_keepalived_enabled | bool
  block:
    - name: Assert at least one VRRP instance is defined
      ansible.builtin.assert:
        that:
          - technitium_dns_keepalived_instances | length > 0
        fail_msg: >-
          technitium_dns_keepalived_enabled is true but
          technitium_dns_keepalived_instances is empty.
        quiet: true

    - name: Assert each VRRP instance is complete
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.interface is defined
          - item.virtual_router_id is defined
          - item.virtual_router_id | int >= 1
          - item.virtual_router_id | int <= 255
          - item.virtual_ipaddresses is defined
          - item.virtual_ipaddresses | length > 0
        fail_msg: >-
          VRRP instance {{ item.name | default('<unnamed>') }} needs name, interface,
          virtual_router_id (1-255) and at least one virtual_ipaddresses entry.
        quiet: true
      loop: "{{ technitium_dns_keepalived_instances }}"
      loop_control:
        label: "{{ item.name | default('<unnamed>') }}"

    - name: Assert virtual_router_id values are unique on this host
      ansible.builtin.assert:
        that:
          - technitium_dns_keepalived_instances | map(attribute='virtual_router_id')
            | list | unique | length
            == technitium_dns_keepalived_instances | length
        fail_msg: >-
          Two VRRP instances on this host share a virtual_router_id. Each instance
          needs its own ID on a given L2 segment.
        quiet: true

    # A node holding the VIP has it as a secondary address, so comparing against
    # every address on the host would fail on the second run. The node's primary
    # address is the one that must never be a VIP.
    - name: Assert the VIP is not this node's primary address
      ansible.builtin.assert:
        that:
          - item.1.address != (ansible_facts['default_ipv4']['address'] | default(''))
        fail_msg: >-
          {{ item.1.address }} is this node's primary address. A VRRP virtual address
          must be an additional address that can move between nodes.
        quiet: true
      loop: "{{ technitium_dns_keepalived_instances | subelements('virtual_ipaddresses') }}"
      loop_control:
        label: "{{ item.1.address }}"
