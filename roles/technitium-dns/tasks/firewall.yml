---
- name: Determine the firewall backend
  ansible.builtin.set_fact:
    technitium_dns_firewall: >-
      {{ technitium_dns_firewall_backend
         if technitium_dns_firewall_backend != 'auto'
         else technitium_dns_firewall_default_backend }}

- name: Determine firewall packages to install
  ansible.builtin.set_fact:
    _technitium_dns_firewall_packages: >-
      {{ technitium_dns_firewall_packages
         if (technitium_dns_firewall_packages is defined and technitium_dns_firewall_packages | length > 0)
         else ([technitium_dns_firewall] if technitium_dns_firewall in ['ufw', 'firewalld'] else []) }}

- name: Refresh the package cache
  ansible.builtin.include_tasks: package_cache.yml
  when: _technitium_dns_firewall_packages | length > 0

- name: Install firewall packages
  ansible.builtin.package:
    name: "{{ _technitium_dns_firewall_packages }}"
    state: present
  when: _technitium_dns_firewall_packages | length > 0

- name: Build the port list
  ansible.builtin.set_fact:
    technitium_dns_firewall_ports: >-
      {{ (
           (['22/tcp'] if technitium_dns_firewall_allow_ssh | default(true) else [])
           + (['53/tcp', '53/udp'] if technitium_dns_firewall_allow_dns else [])
           + ([technitium_dns_api_port ~ '/tcp',
               technitium_dns_https_port ~ '/tcp']
              if technitium_dns_firewall_allow_web_console else [])
           + (['67/udp'] if technitium_dns_firewall_allow_dhcp else [])
           + (['853/tcp', '853/udp'] if technitium_dns_firewall_allow_dot else [])
           + (['443/tcp'] if technitium_dns_firewall_allow_doh else [])
           + technitium_dns_firewall_extra_ports
         ) | unique }}

- name: Configure firewalld
  when: technitium_dns_firewall == 'firewalld'
  block:
    - name: Open the service ports
      ansible.posix.firewalld:
        port: "{{ item }}"
        zone: "{{ technitium_dns_firewall_zone }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ technitium_dns_firewall_ports }}"

    # VRRP is IP protocol 112, not a port, and multicast mode also needs the
    # 224.0.0.18 group to be reachable.
    - name: Allow VRRP
      ansible.posix.firewalld:
        rich_rule: "{{ item }}"
        zone: "{{ technitium_dns_firewall_zone }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - rule protocol value="vrrp" accept
      when: technitium_dns_keepalived_enabled | bool

- name: Configure ufw
  when: technitium_dns_firewall == 'ufw'
  block:
    - name: Open the service ports
      community.general.ufw:
        rule: allow
        port: "{{ (item.split('/'))[0] }}"
        proto: "{{ (item.split('/'))[1] | default('any') }}"
      loop: "{{ technitium_dns_firewall_ports }}"

    - name: Allow VRRP from the other nodes
      community.general.ufw:
        rule: allow
        from_ip: "{{ item }}"
        proto: any
      loop: "{{ technitium_dns_keepalived_default_peers }}"
      when: technitium_dns_keepalived_enabled | bool
